[project]
name = "frontend"
version = "0.1.0"
description = "Frontend dependencies"
readme = "README.md"
authors = [
    { name = "Johnny Hyytiäinen", email = "johnny.hyytiainen@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "streamlit>=1.62.0",
]

[project.scripts]
frontend = "frontend:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
